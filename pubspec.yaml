name: shop_wave
description: ShopWave — A production-ready Flutter e-commerce application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ─────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0

  # ── Navigation ───────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Backend ──────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4
  dio: ^5.8.0+1



  # ── Local Storage ────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0

  # ── UI / UX ──────────────────────────────────────────────────────
  flutter_hooks: ^0.21.3+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1
  another_flushbar: ^2.2.4
  gap: ^3.0.1
  google_fonts: ^8.2.1           # Outfit font via CDN — no local files needed

  # ── Forms & Validation ───────────────────────────────────────────
  reactive_forms: ^18.2.2

  # ── Localization ─────────────────────────────────────────────────
  intl: ^0.20.2

  # ── Utilities ────────────────────────────────────────────────────
  dartz: ^0.10.1
  equatable: ^2.0.7
  logger: ^2.5.0
  connectivity_plus: ^7.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  flutter_animate: ^4.5.2
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4



  # ── Linting ───────────────────────────────────────────────────────
  flutter_lints: ^6.0.0

  # ── Testing ───────────────────────────────────────────────────────
  mocktail: ^1.0.4
  # riverpod_test not added here — use direct ProviderContainer in unit tests

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
